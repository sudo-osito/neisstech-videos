<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neisstech · Videos</title>
<link rel="icon" href="img/neisstech-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
  :root { --azul:#056cf2; --negro:#181818; --fondo:#f5f6f8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--fondo); color:var(--negro); font-family:Poppins, system-ui, sans-serif; }
  button { font:inherit; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .app { height:100vh; height:100dvh; display:flex; flex-direction:column; gap:clamp(10px,2vh,20px); padding:clamp(12px,2.4vh,28px) clamp(14px,3vw,44px); }

  header { display:flex; align-items:center; justify-content:space-between; flex:none; }
  header img { height:clamp(26px,3.6vh,40px); display:block; }
  .puntos { display:flex; gap:8px; }
  .puntos i { width:9px; height:9px; border-radius:9px; background:#d5dae1; transition:all .3s; }
  .puntos i.on { width:28px; background:var(--azul); }

  .escena { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; background:#000; border-radius:clamp(12px,1.6vw,24px); box-shadow:0 18px 50px rgba(24,24,24,.16); object-fit:contain; display:block; }
  .flecha { position:absolute; top:50%; translate:0 -50%; width:clamp(52px,6vw,76px); height:clamp(52px,6vw,76px); border-radius:50%; background:rgba(255,255,255,.92); box-shadow:0 8px 24px rgba(24,24,24,.18); display:grid; place-items:center; color:var(--negro); transition:transform .15s; }
  .flecha:active { transform:scale(.92); }
  .flecha svg { width:42%; height:42%; }
  .izq { left:clamp(10px,1.5vw,22px); } .der { right:clamp(10px,1.5vw,22px); }

  footer { flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .texto { min-width:0; }
  .texto small { color:var(--azul); font-weight:600; font-size:clamp(12px,1.5vh,15px); }
  .texto h1 { font-size:clamp(18px,3vh,32px); font-weight:700; letter-spacing:-.02em; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .botones { display:flex; gap:10px; flex:none; }
  .b { width:clamp(48px,6.4vh,64px); height:clamp(48px,6.4vh,64px); border-radius:50%; background:#fff; box-shadow:0 0 0 1.5px #e3e6eb inset; display:grid; place-items:center; color:var(--negro); transition:transform .15s; }
  .b:active { transform:scale(.92); }
  .b.prim { background:var(--azul); color:#fff; box-shadow:none; }
  .b svg { width:44%; height:44%; }
  .barra { flex:none; display:flex; align-items:center; gap:14px; font-weight:600; font-size:clamp(13px,1.6vh,16px); color:#6b7079; font-variant-numeric:tabular-nums; }
  .pista { position:relative; flex:1; margin:0 12px; height:36px; cursor:pointer; touch-action:none; }
  .pista::before { content:""; position:absolute; left:0; right:0; top:50%; height:8px; translate:0 -50%; border-radius:8px; background:#dfe3e9; }
  .cargado, .hecho { position:absolute; left:0; top:50%; height:8px; translate:0 -50%; border-radius:8px; }
  .cargado { background:#c9d2de; } .hecho { background:var(--azul); }
  .perilla { position:absolute; top:50%; width:22px; height:22px; translate:-50% -50%; border-radius:50%; background:#fff; box-shadow:0 0 0 4px var(--azul), 0 4px 12px rgba(24,24,24,.2); transition:width .15s, height .15s; }
  .pista:active .perilla, .pista.arrastra .perilla { width:28px; height:28px; }
  @media (orientation:portrait) { .app { justify-content:center; } header { margin-bottom:auto; } footer { margin-bottom:auto; } .escena { flex:none; } video { height:auto; aspect-ratio:16/9; } }
  @media (max-width:640px) { footer { flex-direction:column; align-items:stretch; gap:12px; } .botones { justify-content:center; } .texto h1 { white-space:normal; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="img/neisstech-logo.svg" alt="Neisstech">
    <div class="puntos" id="puntos"></div>
  </header>
  <div class="escena">
    <video id="v" playsinline preload="auto"></video>
    <button class="flecha izq" id="ant" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="flecha der" id="sig" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="barra"><span id="ya">0:00</span><div class="pista" id="pista"><div class="cargado" id="cargado"></div><div class="hecho" id="hecho"></div><div class="perilla" id="perilla"></div></div><span id="total">0:00</span></div>
  <footer>
    <div class="texto"><small id="tema"></small><h1 id="titulo"></h1></div>
    <div class="botones">
      <button class="b" id="atras" aria-label="Retroceder 10 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="b prim" id="play" aria-label="Reproducir o pausar"><svg id="ico" viewBox="0 0 24 24" fill="currentColor"></svg></button>
      <button class="b" id="sonido" aria-label="Sonido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/><path id="ondas" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path id="mute" d="M23 9l-6 6M17 9l6 6"/></svg></button>
      <button class="b" id="full" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
    </div>
  </footer>
</div>
<script>
const VIDEOS = [
  { f: "cruce-cd", t: "Cruce inteligente en un centro de distribución", g: "Gestión de tráfico" },
  { f: "barreras-bodega", t: "Sensores y barreras para peatones y grúas horquilla", g: "Gestión de tráfico" },
  { f: "xkube-walmart", t: "X-KUBE: semaforización inteligente en puntos ciegos", g: "Caso de éxito · Walmart" },
  { f: "cruces-cial", t: "Cruces peatonales con señalización virtual y barreras", g: "Caso de éxito · CIAL Alimentos" },
  { f: "intersecciones-ecolab", t: "Seguridad en intersecciones logísticas", g: "Caso de éxito · Ecolab" },
  { f: "seguridad-vial-patagonia", t: "Seguridad vial industrial", g: "Caso de éxito · Patagonia Fresh" },
  { f: "demarcacion-virtual-agrosuper", t: "Demarcación virtual industrial", g: "Caso de éxito · Agrosuper" },
  { f: "andenes-essity", t: "Andenes seguros con cuña electrónica", g: "Caso de éxito · Essity" },
  { f: "transformacion-loginsa", t: "Transformación visual de un centro de distribución", g: "Caso de éxito · LOGINSA" },
];
const $ = (id) => document.getElementById(id), v = $("v");
let i = 0;
$("puntos").innerHTML = VIDEOS.map(() => "<i></i>").join("");
const puntos = [...$("puntos").children];

function ir(k) {
  i = (k + VIDEOS.length) % VIDEOS.length; const x = VIDEOS[i];
  v.src = `videos/${x.f}.mp4`; v.poster = `img/${x.f}.jpg`;
  $("titulo").textContent = x.t; $("tema").textContent = x.g;
  puntos.forEach((p, n) => p.classList.toggle("on", n === i));
  v.play().catch(() => {});
}
function estado() {
  $("ico").innerHTML = v.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  $("ondas").style.display = v.muted ? "none" : ""; $("mute").style.display = v.muted ? "" : "none";
}
const alternar = () => v.paused ? v.play() : v.pause();
$("ant").onclick = () => ir(i - 1);
$("sig").onclick = () => ir(i + 1);
$("play").onclick = alternar;
v.onclick = alternar;
$("atras").onclick = () => v.currentTime = Math.max(0, v.currentTime - 10);
$("sonido").onclick = () => { v.muted = !v.muted; estado(); };
$("full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : v.webkitEnterFullscreen && v.webkitEnterFullscreen());
v.onplay = v.onpause = v.onvolumechange = estado;
// barra para explorar el video: tocar o arrastrar
const mmss = (s) => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
let arrastrando = false;
function pintar(t) {
  const d = v.duration || 0, p = d ? Math.min(1, t / d) * 100 : 0;
  $("hecho").style.width = p + "%"; $("perilla").style.left = p + "%";
  $("ya").textContent = mmss(t); $("total").textContent = mmss(d);
  if (v.buffered.length && d) $("cargado").style.width = (v.buffered.end(v.buffered.length - 1) / d) * 100 + "%";
}
v.ontimeupdate = v.onloadedmetadata = v.onprogress = () => { if (!arrastrando) pintar(v.currentTime); };
const pista = $("pista");
const aTiempo = (e) => { const r = pista.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (v.duration || 0); };
pista.onpointerdown = (e) => { arrastrando = true; pista.classList.add("arrastra"); pista.setPointerCapture(e.pointerId); pintar(aTiempo(e)); };
pista.onpointermove = (e) => { if (arrastrando) pintar(aTiempo(e)); };
pista.onpointerup = pista.onpointercancel = (e) => { if (!arrastrando) return; arrastrando = false; pista.classList.remove("arrastra"); v.currentTime = aTiempo(e); };
v.onended = () => ir(i + 1);
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") ir(i + 1);
  else if (e.key === "ArrowLeft") ir(i - 1);
  else if (e.key === " ") { e.preventDefault(); alternar(); }
});
v.muted = true; ir(0); estado();
</script>
</body>
</html>
