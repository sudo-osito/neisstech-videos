<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neisstech · Videos</title>
<link rel="icon" href="img/neisstech-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  :root { --azul:#056cf2; --azul2:#0a4fb3; --negro:#181818; --gris:#6b7079; --borde:#e3e6eb; --fondo:#f5f6f8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--fondo); color:var(--negro); font-family:Poppins, system-ui, sans-serif; }
  button { font:inherit; cursor:pointer; border:0; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px clamp(16px,3vw,40px); }
  header img { height:38px; display:block; }
  header span { font-weight:600; color:var(--azul); font-size:clamp(14px,1.4vw,20px); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px; padding:0 clamp(16px,3vw,40px) 32px; align-items:start; }
  @media (max-width:1000px) { main { grid-template-columns:minmax(0,1fr); } }
  main > * { min-width:0; }

  .reproductor { width:min(100%, calc((100vh - 370px) * 16 / 9)); margin:0 auto; background:#000; border-radius:22px; overflow:hidden; aspect-ratio:16/9; position:relative; box-shadow:0 18px 50px rgba(24,24,24,.18); }
  video { width:100%; height:100%; display:block; background:#000; object-fit:contain; }
  .info, .controles { width:min(100%, calc((100vh - 370px) * 16 / 9)); margin-left:auto; margin-right:auto; }
  @media (max-width:1000px) { .reproductor, .info, .controles { width:100%; } }
  .info { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-top:18px; }
  .tag { display:inline-flex; align-items:center; gap:8px; background:#e6f0fe; color:var(--azul); font-weight:600; font-size:14px; padding:6px 14px; border-radius:99px; }
  .tag i { width:8px; height:8px; border-radius:50%; background:var(--azul); }
  h1 { font-size:clamp(22px,2.4vw,34px); font-weight:700; letter-spacing:-.02em; line-height:1.15; margin-top:10px; }
  .cliente { color:var(--gris); font-weight:500; margin-top:4px; font-size:16px; }
  .cuenta { color:var(--gris); font-weight:600; white-space:nowrap; margin-top:8px; }

  .controles { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; height:60px; padding:0 26px; border-radius:16px; background:#fff; color:var(--negro); font-weight:600; font-size:18px; border:1.5px solid var(--borde); transition:transform .12s, background .2s; -webkit-tap-highlight-color:transparent; }
  .btn:active { transform:scale(.96); }
  .btn svg { width:24px; height:24px; }
  .btn.prim { background:var(--azul); color:#fff; border-color:var(--azul); }
  .btn.prim:hover { background:var(--azul2); }
  .btn:hover { border-color:#c9cfd8; }
  .crece { flex:1 1 150px; }
  @media (max-width:700px) { header span { display:none; } .btn { height:54px; padding:0 14px; font-size:16px; flex:1 1 auto; } .crece { flex:1 1 30%; } .item { grid-template-columns:120px 1fr; } }
  html, body { overflow-x:hidden; }

  aside { display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 100px); overflow:auto; padding-right:4px; }
  @media (max-width:1000px) { .item { grid-template-columns:1fr !important; } aside { max-height:none; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); } }
  .item { display:grid; grid-template-columns:150px 1fr; gap:14px; align-items:center; background:#fff; border:1.5px solid var(--borde); border-radius:16px; padding:10px; text-align:left; transition:border-color .2s, box-shadow .2s; }
  .item:hover { border-color:#c9cfd8; }
  .item.activo { border-color:var(--azul); box-shadow:0 0 0 3px rgba(5,108,242,.15); }
  .mini { position:relative; border-radius:10px; overflow:hidden; aspect-ratio:16/9; background:#ddd; }
  .mini img { width:100%; height:100%; object-fit:cover; display:block; }
  .mini b { position:absolute; right:6px; bottom:6px; background:rgba(24,24,24,.85); color:#fff; font-size:12px; font-weight:600; padding:2px 7px; border-radius:6px; }
  .item.activo .mini::after { content:"▶ Viendo"; position:absolute; left:6px; top:6px; background:var(--azul); color:#fff; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; }
  .item h3 { font-size:15px; font-weight:600; line-height:1.25; }
  .item p { font-size:13px; color:var(--gris); margin-top:4px; }
</style>
</head>
<body>
<header>
  <img src="img/neisstech-logo.svg" alt="Neisstech">
  <span>Casos reales · Gestión de tráfico y seguridad industrial</span>
</header>
<main>
  <section>
    <div class="reproductor"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="info">
      <div>
        <span class="tag"><i></i><span id="tag"></span></span>
        <h1 id="titulo"></h1>
        <div class="cliente" id="cliente"></div>
      </div>
      <div class="cuenta" id="cuenta"></div>
    </div>
    <div class="controles">
      <button class="btn crece" id="ant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Anterior</button>
      <button class="btn prim crece" id="play"><svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span id="txtPlay">Reproducir</span></button>
      <button class="btn crece" id="sig">Siguiente<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn" id="atras" title="Retroceder 10 s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>10 s</button>
      <button class="btn" id="adelante" title="Adelantar 10 s">10 s<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="btn" id="sonido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path id="ondas" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span id="txtSon">Sonido</span></button>
      <button class="btn" id="full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>Pantalla completa</button>
    </div>
  </section>
  <aside id="lista"></aside>
</main>
<script>
const VIDEOS = [
  { f: "cruce-cd", t: "Cruce inteligente en un centro de distribución", c: "Proyecto Neisstech", g: "Gestión de tráfico" },
  { f: "barreras-bodega", t: "Sensores y barreras para peatones y grúas horquilla", c: "Proyecto Neisstech", g: "Gestión de tráfico" },
  { f: "xkube-walmart", t: "X-KUBE: semaforización inteligente en puntos ciegos", c: "Caso de éxito · Walmart", g: "Gestión de tráfico" },
  { f: "cruces-cial", t: "Cruces peatonales con señalización virtual y barreras", c: "Caso de éxito · CIAL Alimentos", g: "Gestión de tráfico" },
  { f: "intersecciones-ecolab", t: "Seguridad en intersecciones logísticas", c: "Caso de éxito · Ecolab", g: "Gestión de tráfico" },
  { f: "seguridad-vial-patagonia", t: "Seguridad vial industrial", c: "Caso de éxito · Patagonia Fresh", g: "Gestión de tráfico" },
  { f: "demarcacion-virtual-agrosuper", t: "Demarcación virtual industrial", c: "Caso de éxito · Agrosuper", g: "Demarcación virtual" },
  { f: "andenes-essity", t: "Andenes seguros con cuña electrónica SafetyDock", c: "Caso de éxito · Essity", g: "Carga y descarga" },
  { f: "transformacion-loginsa", t: "Transformación visual de un centro de distribución", c: "Caso de éxito · LOGINSA", g: "Gestión visual" },
];
const $ = (id) => document.getElementById(id), v = $("v");
let i = 0;
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

$("lista").innerHTML = VIDEOS.map((x, k) => `
  <button class="item" data-k="${k}">
    <div class="mini"><img src="img/${x.f}.jpg" alt="" loading="lazy"><b id="d${k}"></b></div>
    <div><h3>${x.t}</h3><p>${x.c}</p></div>
  </button>`).join("");
document.querySelectorAll(".item").forEach((b) => b.onclick = () => ir(+b.dataset.k, true));
// duración de cada video sin bajarlo entero
VIDEOS.forEach((x, k) => { const m = document.createElement("video"); m.preload = "metadata"; m.src = `videos/${x.f}.mp4`; m.onloadedmetadata = () => { $("d" + k).textContent = mmss(m.duration); m.src = ""; }; });

function ir(k, jugar) {
  i = (k + VIDEOS.length) % VIDEOS.length; const x = VIDEOS[i];
  v.src = `videos/${x.f}.mp4`; v.poster = `img/${x.f}.jpg`;
  $("titulo").textContent = x.t; $("cliente").textContent = x.c; $("tag").textContent = x.g;
  $("cuenta").textContent = `${i + 1} de ${VIDEOS.length}`;
  document.querySelectorAll(".item").forEach((b, n) => b.classList.toggle("activo", n === i));
  document.querySelector(".item.activo")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if (jugar) v.play().catch(() => {});
}
function estado() {
  const p = v.paused;
  $("txtPlay").textContent = p ? "Reproducir" : "Pausa";
  $("icoPlay").innerHTML = p ? '<path d="M8 5v14l11-7z"/>' : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  $("txtSon").textContent = v.muted ? "Activar sonido" : "Silenciar";
  $("ondas").style.opacity = v.muted ? .2 : 1;
}
$("ant").onclick = () => ir(i - 1, true);
$("sig").onclick = () => ir(i + 1, true);
$("play").onclick = () => v.paused ? v.play() : v.pause();
$("atras").onclick = () => v.currentTime = Math.max(0, v.currentTime - 10);
$("adelante").onclick = () => v.currentTime = Math.min(v.duration || 0, v.currentTime + 10);
$("sonido").onclick = () => { v.muted = !v.muted; estado(); };
$("full").onclick = () => (v.requestFullscreen || v.webkitEnterFullscreen || v.webkitRequestFullscreen)?.call(v);
v.onplay = v.onpause = v.onvolumechange = estado;
v.onended = () => ir(i + 1, true);   // al terminar sigue con el próximo
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") ir(i + 1, true);
  else if (e.key === "ArrowLeft") ir(i - 1, true);
  else if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key.toLowerCase() === "f") $("full").click();
});
v.muted = true;   // así parte solo; el botón activa el sonido
ir(0, true); estado();
</script>
</body>
</html>
